<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E3329">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Réserve">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Réserve</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{
  --ink:#1E3329; --ink2:#2E4A3D; --paper:#EDEFE8; --card:#F8F9F5; --line:#D3D8CF; --tin:#8E978F; --text:#1C231F; --mute:#5E6862;
  --prot:#A8432F; --lip:#C99513; --glu:#6A8A2E; --eau:#2F6E9A; --exp:#B3261E; --soon:#C77700;
  --cond:"Barlow Condensed", "Arial Narrow", sans-serif; --body:"Barlow", system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--text);font:16px/1.45 var(--body);-webkit-text-size-adjust:100%}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
main{max-width:640px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px 24px}
h1{font:700 2rem/1.05 var(--cond);margin:.4rem 0 .6rem;letter-spacing:-.01em}
h2{font:600 1.35rem/1.1 var(--cond);margin:1.4rem 0 .5rem}
h3{font:600 1rem var(--body);margin:.9rem 0 .3rem;color:var(--mute)}
p{margin:.3rem 0}
.lead{color:var(--mute);max-width:36em}
.num{font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--lip);outline-offset:2px}

/* Hero : le compteur d'autonomie */
.hero{background:var(--ink);color:var(--paper);margin:calc(-12px - env(safe-area-inset-top)) -16px 0;padding:calc(20px + env(safe-area-inset-top)) 20px 20px}
.count{display:flex;align-items:baseline;gap:.4rem}
.count .n{font:700 5.5rem/0.85 var(--cond);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.count .u{font:600 1.8rem/1 var(--cond);color:#C9D1C8}
.hero p{color:#C9D1C8;margin-top:.5rem}
.track{height:6px;background:var(--ink2);border-radius:3px;margin:.8rem 0 1rem;overflow:hidden}
.track span{display:block;height:100%;background:var(--lip)}
.facts{display:flex;gap:28px}
.facts b{display:block;font:600 1.5rem/1.1 var(--cond);font-variant-numeric:tabular-nums}
.facts span{font-size:.85rem;color:#C9D1C8}
.mbar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--ink2);margin:1rem 0 .5rem}
.mleg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:.85rem;color:#C9D1C8}
.mleg b{color:var(--paper);font-weight:600}
.mleg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:1px}
.hero .note{font-size:.85rem;color:#E4C77A;margin-top:.8rem}

/* Contrôles */
.seg{display:flex;background:#DDE1D8;border-radius:10px;padding:3px;margin:1rem 0}
.seg button{flex:1;border:0;background:none;padding:.5rem;border-radius:8px;font-weight:600}
.seg button.on{background:var(--card);box-shadow:0 1px 2px rgba(30,51,41,.18)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;border:1.5px solid var(--ink);background:none;border-radius:10px;padding:.7rem 1rem;font-weight:600;cursor:pointer;text-align:center}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.big{width:100%;padding:1.1rem;font:600 1.3rem var(--cond)}
.btn.danger{border-color:var(--exp);color:var(--exp)}
.btn.small{padding:.4rem .7rem;font-size:.9rem}
.stack{display:grid;gap:10px;margin:1rem 0}
.actions{display:flex;gap:10px;margin-top:1rem}
.actions .btn{flex:1}
.actions.sticky{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom));background:var(--paper);padding:10px 0}

.form{display:grid;gap:12px}
label{display:grid;gap:4px;font-size:.85rem;font-weight:500;color:var(--mute)}
input,select{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:9px;padding:.65rem .7rem;font-size:1rem;color:var(--text);min-width:0}
input:focus,select:focus{border-color:var(--ink);outline:none}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
label.check{display:flex;align-items:flex-start;gap:10px;font-size:.95rem;color:var(--text)}
label.check input{width:22px;height:22px;flex:none;margin:0}
.hint{font-size:.85rem;color:var(--mute)}
.warn{color:var(--exp);font-weight:500}
.prod-head{display:flex;gap:12px;align-items:center}
.prod-head img{width:56px;height:56px;object-fit:contain;background:#fff;border-radius:8px;border:1px solid var(--line)}
.codeline{display:flex;gap:8px}
.codeline input{flex:1}

/* Stock */
.catblock{margin-top:1.2rem}
.cath{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid currentColor;padding-bottom:4px;margin-bottom:4px}
.cath h2{margin:0}
.cath span{font-size:.85rem;color:var(--mute)}
ul{list-style:none;margin:0;padding:0}
.lot{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.lotmain{flex:1;min-width:0;cursor:pointer}
.nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{font-size:.85rem;color:var(--mute)}
.dt{font-size:.85rem;font-weight:500}
.lot.exp .dt{color:var(--exp)} .lot.soon .dt{color:var(--soon)} .lot.ddm .dt{color:var(--soon)}
.lot.exp{border-left:4px solid var(--exp);padding-left:8px}
.lot.soon,.lot.ddm{border-left:4px solid var(--soon);padding-left:8px}
.qty{display:flex;align-items:center;gap:2px;flex:none}
.qty button{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);font-size:1.2rem;line-height:1}
.qty span{min-width:30px;text-align:center;font:600 1.2rem var(--cond);font-variant-numeric:tabular-nums}
.cattag{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.prio{border-left:4px solid var(--soon)}
.shop li{padding:8px 0;border-bottom:1px solid var(--line)}
.shop li:last-child{border:0}

.empty{text-align:center;padding:2rem 1rem}
.empty p{color:var(--mute);margin-bottom:1rem}

.loading{text-align:center;padding:3rem 1rem;color:var(--mute)}
.spin{width:36px;height:36px;border:4px solid var(--line);border-top-color:var(--ink);border-radius:50%;margin:0 auto 1rem;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* Prix */
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips button{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:20px;padding:.35rem .8rem;font-size:.9rem;font-weight:500}
.chips button.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.pg{border-bottom:1px solid var(--line)}
.pgh{display:grid;grid-template-columns:1fr auto;gap:2px 12px;width:100%;text-align:left;border:0;background:none;padding:12px 0;cursor:pointer}
.pn{font-weight:600}
.pv{font:600 1.2rem var(--cond);font-variant-numeric:tabular-nums;text-align:right}
.ps{font-size:.85rem;color:var(--mute);grid-column:1}
.pgh svg{grid-column:2;justify-self:end}
.up{color:var(--exp)} .down{color:var(--glu)}
.pdet{padding:0 0 12px}
.pdet table{width:100%;border-collapse:collapse;font-size:.9rem;font-variant-numeric:tabular-nums;margin:.4rem 0 .8rem}
.pdet td,.pdet th{padding:5px 4px;border-bottom:1px solid var(--line);text-align:left}
.pdet th{font-weight:600;color:var(--mute);font-size:.8rem}
.pdet td.r,.pdet th.r{text-align:right}
.del{border:0;background:none;color:var(--exp);font-size:1.1rem;padding:0 4px}

/* Nav */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--ink);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:10}
nav button{flex:1;border:0;background:none;color:#AEB9AF;font:600 1rem var(--cond);padding:10px 2px;border-radius:8px;letter-spacing:.02em}
nav button.on{color:var(--paper);background:var(--ink2)}

#scan{position:fixed;inset:0;background:#000;z-index:30;display:flex;flex-direction:column;justify-content:center;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#scan[hidden]{display:none}
#reader{width:100%}
#scan p{color:#ddd;text-align:center;margin:1rem}
#scan .btn{margin:0 auto;border-color:#fff;color:#fff;min-width:160px}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:#fff;padding:.7rem 1rem;border-radius:10px;font-size:.95rem;max-width:90vw;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main id="main"></main>

<nav aria-label="Navigation">
  <button data-v="stock" onclick="go('stock')">Stock</button>
  <button data-v="add" onclick="go('add')">Ajouter</button>
  <button data-v="recipes" onclick="go('recipes')">Recettes</button>
  <button data-v="prices" onclick="go('prices')">Prix</button>
  <button data-v="settings" onclick="go('settings')">Réglages</button>
</nav>

<div id="scan" hidden>
  <div id="reader"></div>
  <p>Vise le code-barres, il est lu automatiquement.</p>
  <button class="btn" onclick="closeScanner()">Fermer</button>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- Données ---------- */
const CATS = {
  proteines:{label:'Protéines', color:'var(--prot)'},
  lipides:{label:'Lipides', color:'var(--lip)'},
  glucides:{label:'Glucides', color:'var(--glu)'},
  eau:{label:'Eau', color:'var(--eau)'},
  hygiene:{label:'Hygiène', color:'var(--tin)'},
  pharmacie:{label:'Pharmacie', color:'var(--tin)'},
  autre:{label:'Autre', color:'var(--tin)'}
};
const MACROS = ['proteines','lipides','glucides'];
const STORES = ['Auchan','Aldi','Carrefour','Intermarché','Monoprix','Lidl'];
function normalizeStore(raw){
  const s = String(raw||'').trim(); if(!s) return '';
  const u = s.toUpperCase();
  if(/CARREFOUR/.test(u)) return 'Carrefour';
  if(/AUCHAN/.test(u)) return 'Auchan';
  if(/\bALDI\b/.test(u)) return 'Aldi';
  if(/INTERMARCH/.test(u)) return 'Intermarché';
  if(/MONOPRIX/.test(u)) return 'Monoprix';
  if(/\bLIDL\b/.test(u)) return 'Lidl';
  return s;
}
const MK = {proteines:'pk', lipides:'fk', glucides:'ck'};
const MF = {proteines:['p100',4], lipides:['f100',9], glucides:['c100',4]};
const MODELS = [['claude-haiku-4-5-20251001','Haiku 4.5, économique'],['claude-sonnet-5','Sonnet 5, plus précis']];
const STAPLES = ['Oignon','Ail','Œuf','Beurre','Huile','Sel','Poivre','Farine','Lait','Citron'];
const DEFAULTS = {settings:{apiKey:'', model:MODELS[0][0], people:1, kcal:2000, water:2, targetDays:90, alertWeeks:8, split:{proteines:20, lipides:30, glucides:50}}, products:{}, items:[], purchases:[], favRecipes:[]};
const KEY = 'reserve-v1';
const clone = o => JSON.parse(JSON.stringify(o));

function merge(d){
  const b = clone(DEFAULTS), s = d.settings || {};
  return {settings:{...b.settings, ...s, split:{...b.settings.split, ...(s.split||{})}}, products:d.products||{}, items:d.items||[], purchases:d.purchases||[], favRecipes:d.favRecipes||[]};
}
function load(){ try{ const s = localStorage.getItem(KEY); if(s) return merge(JSON.parse(s)); }catch(e){} return clone(DEFAULTS); }
let S = load();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast('Sauvegarde impossible sur cet appareil'); } }
if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});

/* ---------- Utilitaires ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const num = v => { const n = parseFloat(String(v ?? '').replace(',','.')); return isFinite(n) ? n : 0; };
const eur = n => n.toLocaleString('fr-FR', {style:'currency', currency:'EUR'});
const fmt = (n, d=0) => (n||0).toLocaleString('fr-FR', {maximumFractionDigits:d});
const round2 = n => Math.round(n*100)/100;
function todayLocal(){ const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
function daysUntil(date){ return Math.round((new Date(date+'T00:00') - new Date(todayLocal()+'T00:00')) / 86400000); }
function fdate(d){ if(!d) return ''; const [y,m,dd] = d.split('-'); return `${dd}/${m}/${y}`; }
function unitOf(cat){ return cat === 'eau' ? '/L' : '/kg'; }
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2800); }

function guessCat(p, f, c, tags=[]){
  if(tags.some(t => /waters|eaux/.test(t))) return 'eau';
  const a = [['proteines',p*4],['lipides',f*9],['glucides',c*4]].sort((x,y) => y[1]-x[1]);
  return a[0][1] > 0 ? a[0][0] : 'autre';
}
function catOptions(sel){ return Object.entries(CATS).map(([k,v]) => `<option value="${k}" ${k===sel?'selected':''}>${v.label}</option>`).join(''); }
function isDead(it){ return it.dateType === 'DLC' && it.date && daysUntil(it.date) < 0; }

/* ---------- Calculs de stock ---------- */
function itemStats(it){
  const p = S.products[it.productKey]; const r = {kcal:0, pk:0, fk:0, ck:0, liters:0};
  if(!p) return r;
  const f = num(p.weightG) * it.qty / 100;
  if(p.category === 'eau'){ r.liters = num(p.weightG) * it.qty / 1000; return r; }
  r.kcal = num(p.kcal100)*f; r.pk = num(p.p100)*4*f; r.fk = num(p.f100)*9*f; r.ck = num(p.c100)*4*f;
  return r;
}
function totals(){
  const t = {kcal:0, pk:0, fk:0, ck:0, liters:0, missing:0};
  for(const it of S.items){
    if(it.qty <= 0 || isDead(it)) continue;
    const s = itemStats(it); for(const k in s) t[k] += s[k];
    const p = S.products[it.productKey];
    if(p && MACROS.includes(p.category) && !num(p.kcal100)) t.missing++;
  }
  return t;
}
function status(it){
  if(!it.date) return {cls:'', txt:'Sans date', rank:4};
  const d = daysUntil(it.date), w = S.settings.alertWeeks * 7;
  if(d < 0) return it.dateType === 'DDM' ? {cls:'ddm', txt:`DDM passée depuis ${-d} j, encore consommable`, rank:1} : {cls:'exp', txt:`DLC dépassée depuis ${-d} j`, rank:0};
  if(d <= w) return {cls:'soon', txt:`${it.dateType} dans ${d} j (${fdate(it.date)})`, rank:2};
  return {cls:'', txt:`${it.dateType} ${fdate(it.date)}`, rank:3};
}

/* ---------- Prix ---------- */
function ppk(p){ const w = num(p.weightG) * num(p.qty); return w ? p.total / (w/1000) : null; }
function sameGeneric(a, b){ return (a||'').trim().toLowerCase() === (b||'').trim().toLowerCase(); }
function kcalOf(p){
  let prod = p.productKey && S.products[p.productKey];
  if(!prod || !num(prod.kcal100)) prod = Object.values(S.products).find(x => x.generic && sameGeneric(x.generic, p.generic) && num(x.kcal100));
  if(!prod) return null;
  const w = num(p.weightG) || num(prod.weightG);
  return w ? num(prod.kcal100) * w / 100 * num(p.qty || 1) : null;
}
function per1000(p){ const k = kcalOf(p); return k ? p.total / k * 1000 : null; }
function unitPriceFor(prod){
  const l = S.purchases.filter(x => x.productKey === prod.key || (prod.generic && sameGeneric(x.generic, prod.generic)));
  if(!l.length) return null;
  let best = null; for(const x of l){ const v = ppk(x); if(v != null && (best == null || v < best)) best = v; }
  if(best != null && num(prod.weightG)) return best * num(prod.weightG) / 1000;
  const x = l[l.length-1]; return x.total / num(x.qty || 1);
}
function genericsList(){ return [...new Set(Object.values(S.products).map(p => p.generic).concat(S.purchases.map(p => p.generic)).filter(Boolean).map(s => s.trim()))].sort((a,b) => a.localeCompare(b,'fr')); }
function datalists(){ return `<datalist id="generics">${genericsList().map(g => `<option value="${esc(g)}">`).join('')}</datalist>`; }
function storeSelect(value, other){
  const showOther = other || (value && !STORES.includes(value));
  const selVal = showOther ? 'Autre' : value;
  const opts = ['', ...STORES, 'Autre'].map(o => `<option value="${esc(o)}" ${o===selVal?'selected':''}>${o||'Choisir…'}</option>`).join('');
  return `<select onchange="setStore(this.value)">${opts}</select>${showOther ? `<input style="margin-top:6px" placeholder="Nom de l'enseigne" value="${esc(value)}" oninput="draft.store=this.value">` : ''}`;
}
function setStore(v){
  if(!draft) return;
  if(v === 'Autre'){ draft.storeOther = true; if(STORES.includes(draft.store)) draft.store = ''; }
  else { draft.storeOther = false; draft.store = v; }
  render();
}

/* ---------- Navigation ---------- */
let view = 'stock';
function go(v){ view = v; render(); window.scrollTo(0,0); }
function render(){
  const views = {stock:renderStock, add:renderAdd, recipes:renderRecipes, prices:renderPrices, settings:renderSettings};
  $('#main').innerHTML = views[view]();
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === view));
}

/* ---------- Vue Stock ---------- */
let sortMode = 'cat';
function setSort(m){ sortMode = m; render(); }
function hero(){
  const st = S.settings, t = totals();
  const need = st.people * st.kcal, days = need ? t.kcal / need : 0;
  const wdays = st.people * st.water ? t.liters / (st.people * st.water) : 0;
  const macro = t.pk + t.fk + t.ck;
  const share = m => macro ? t[MK[m]] / macro * 100 : 0;
  return `<section class="hero">
    <div class="count"><span class="n">${fmt(Math.floor(days))}</span><span class="u">jour${days >= 2 ? 's' : ''}</span></div>
    <p>de nourriture pour ${st.people} personne${st.people > 1 ? 's' : ''}, sur un objectif de ${st.targetDays} jours.</p>
    <div class="track"><span style="width:${Math.min(100, st.targetDays ? days/st.targetDays*100 : 0)}%"></span></div>
    <div class="facts">
      <div><b>${fmt(wdays,1)} j</b><span>d'eau</span></div>
      <div><b>${fmt(t.kcal)}</b><span>kcal en stock</span></div>
    </div>
    <div class="mbar">${MACROS.map(m => `<span style="width:${share(m)}%;background:${CATS[m].color}"></span>`).join('')}</div>
    <div class="mleg">${MACROS.map(m => `<div><i style="background:${CATS[m].color}"></i>${CATS[m].label}<br><b>${fmt(share(m))} %</b> pour ${num(st.split[m])} % visés</div>`).join('')}</div>
    ${t.missing ? `<p class="note">${t.missing} produit${t.missing>1?'s':''} sans calories renseignées : ${t.missing>1?'ils ne comptent':'il ne compte'} pas encore.</p>` : ''}
  </section>`;
}
function lotRow(it){
  const p = S.products[it.productKey] || {name:'Produit inconnu'};
  const s = status(it), st = itemStats(it);
  const meta = [];
  if(num(p.weightG)) meta.push(fmt(num(p.weightG)) + (p.category === 'eau' ? ' ml' : ' g'));
  if(st.kcal) meta.push(fmt(st.kcal) + ' kcal au total');
  if(p.brand) meta.push(esc(p.brand));
  return `<li class="lot ${s.cls}">
    <div class="lotmain" onclick="editLot('${it.id}')">
      <div class="nm"><span class="cattag" style="background:${(CATS[p.category]||CATS.autre).color}"></span>${esc(p.name)}</div>
      <div class="meta">${meta.join(', ')}</div>
      <div class="dt">${esc(s.txt)}</div>
    </div>
    <div class="qty"><button aria-label="Consommer une unité" onclick="consume('${it.id}')">−</button><span>${it.qty}</span><button aria-label="Ajouter une unité" onclick="bump('${it.id}')">+</button></div>
  </li>`;
}
function shopping(){
  const st = S.settings, t = totals(), total = st.people * st.kcal * st.targetDays, out = [];
  for(const m of MACROS){
    const def = total * num(st.split[m]) / 100 - t[MK[m]];
    if(def <= 0) continue;
    let best = null;
    for(const p of Object.values(S.products)){
      if(p.category !== m) continue;
      const [f,k] = MF[m], per = num(p[f]) * k * num(p.weightG) / 100;
      if(!per) continue;
      const price = unitPriceFor(p), cost = price ? price / per : null;
      if(!best || (cost != null && (best.cost == null || cost < best.cost)) || (cost == null && best.cost == null && per > best.per)) best = {p, per, price, cost};
    }
    let txt = `<b>${CATS[m].label}</b> : il manque environ ${fmt(def)} kcal.`;
    if(best){ const n = Math.ceil(def / best.per); txt += ` Soit ${n} × ${esc(best.p.name)}${best.price ? `, environ ${eur(n*best.price)}` : ''}.`; }
    out.push(txt);
  }
  const wdef = st.people * st.water * st.targetDays - t.liters;
  if(wdef > 0) out.push(`<b>Eau</b> : il manque ${fmt(wdef)} litres.`);
  if(!out.length) return '';
  return `<h2>Pour tenir ${st.targetDays} jours</h2><div class="card"><ul class="shop">${out.map(x => `<li>${x}</li>`).join('')}</ul>
    <p class="hint">Suggestion basée sur le produit le moins cher par calorie parmi tes achats.</p></div>`;
}
function renderStock(){

}

let scanner = null, scanned = false;
async function openScanner(){
  if(!window.Html5Qrcode) return toast('Lecteur indisponible sans réseau : tape le code à la main.');
  $('#scan').hidden = false; scanned = false;
  const F = Html5QrcodeSupportedFormats;
  scanner = new Html5Qrcode('reader', {formatsToSupport:[F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E], experimentalFeatures:{useBarCodeDetectorIfSupported:true}, verbose:false});
  try{
    await scanner.start({facingMode:'environment'}, {fps:10, qrbox:(w,h) => ({width:Math.floor(Math.min(320, w*0.85)), height:150})},
      code => { if(scanned) return; scanned = true; closeScanner(); lookup(code); }, () => {});
  }catch(e){ closeScanner(); toast("Caméra inaccessible. Autorise l'accès à la caméra pour ce site dans les réglages."); }
}
async function closeScanner(){
  $('#scan').hidden = true;
  if(scanner){ const s = scanner; scanner = null; try{ await s.stop(); }catch(e){} try{ s.clear(); }catch(e){} }

async function lookup(code){
  code = String(code||'').replace(/\D/g,'');
  if(code.length < 6) return toast('Code-barres invalide');
  if(S.products[code]){ draft = {...emptyDraft(), ...S.products[code], productKey:code, barcode:code, catTouched:true}; toast('Produit déjà connu'); go('add'); return; }
  draft = {...emptyDraft(), barcode:code}; loading = true; go('add');
  try{
    const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=product_name,product_name_fr,generic_name_fr,brands,product_quantity,nutriments,image_front_small_url,categories_tags`);
    const j = await r.json();
    if(j.status === 1 && j.product){
      const p = j.product, n = p.nutriments || {};
      Object.assign(draft, {name:p.product_name_fr || p.product_name || '', brand:(p.brands||'').split(',')[0].trim(), generic:p.generic_name_fr || '',
        weightG:p.product_quantity || '', kcal100:n['energy-kcal_100g'] ?? '', p100:n.proteins_100g ?? '', f100:n.fat_100g ?? '', c100:n.carbohydrates_100g ?? '', image:p.image_front_small_url || ''});
      draft.category = guessCat(num(draft.p100), num(draft.f100), num(draft.c100), p.categories_tags || []);
      toast('Produit trouvé, vérifie la fiche');
    } else toast("Produit inconnu d'Open Food Facts : complète la fiche, elle sera retenue.");
  }catch(e){ toast('Pas de réseau : complète la fiche à la main.'); }
  loading = false; render();
}

async function claudeJSON(content, netErr){
  let r;
  try{
    r = await fetch('https://api.anthropic.com/v1/messages', {method:'POST',
      headers:{'content-type':'application/json', 'x-api-key':S.settings.apiKey, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:S.settings.model, max_tokens:4096, messages:[{role:'user', content}]})});
  }catch(e){ throw new Error(netErr); }
  const j = await r.json().catch(() => ({}));
  if(!r.ok){
    if(r.status === 401) throw new Error('Clé API refusée. Vérifie-la dans Réglages.');
    throw new Error((j.error && j.error.message) || ('Erreur API ' + r.status));
  }
  const txt = (j.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
  const a = txt.indexOf('{'), z = txt.lastIndexOf('}');
  if(a < 0) throw new Error('Réponse illisible. Réessaie.');
  try{ return JSON.parse(txt.slice(a, z+1)); }catch(e){ throw new Error('Réponse illisible. Réessaie.'); }
}

${o.noPower ? "Contrainte : pas d'électricité disponible. Cuisson uniquement au réchaud à gaz ou sans cuisson, temps courts, peu d'eau." : ''}

function normalizeRecipes(json, stock, o){
  const byKey = {}; for(const s of stock) byKey[s.key] = s;
  return (json.recipes || []).slice(0,3).map(r => {
    const ingredients = (r.ingredients || []).map(it => {
      if(it.stock_key && byKey[it.stock_key]){
        const avail = byKey[it.stock_key].qty, qty = Math.max(1, Math.round(num(it.qty)) || 1);
        return {name:byKey[it.stock_key].name, stockKey:it.stock_key, qty, avail, staple:false, ok:qty <= avail};
      }
      const isStaple = STAPLES.some(s => sameGeneric(s, it.name));
      return {name:it.name || '?', stockKey:null, qty:num(it.qty) || 1, avail:null, staple:isStaple, ok:isStaple};
    });
    const missing = ingredients.filter(i => !i.ok).map(i => i.stockKey ? `${i.name} (il n'en reste que ${i.avail})` : i.name);
    return {id:uid(), title:r.title || 'Recette', servings:Math.max(1, parseInt(r.servings) || o.people), timeMin:num(r.time_minutes), kcal:num(r.kcal_per_portion),
      steps:(r.steps || []).map(String), ingredients, missing};
  });
}
async function generateRecipes(){
  if(!S.settings.apiKey){ toast('Ajoute ta clé API dans Réglages'); go('settings'); return; }
  const stock = stockSummary();
  if(!stock.length){ toast('Stock vide : ajoute des produits pour obtenir des recettes.'); return; }
  const o = recipeOpts;
  recipes = {loading:true}; render();
  try{
    const json = await claudeJSON([{type:'text', text:recipesPrompt(stock, o)}], "Pas de réseau. Cette fonction nécessite une connexion.");
    const list = normalizeRecipes(json, stock, o);
    recipes = {list: list.length ? list : null, error: list.length ? null : "Aucune recette obtenue. Réessaie."};
  }catch(e){ recipes = {error: e.message || 'Erreur inconnue'}; }
  render();
}

  const idx = S.favRecipes.findIndex(f => f.id === id);
  if(idx >= 0){ S.favRecipes.splice(idx, 1); toast('Retiré des favoris'); }
  else { const r = findRecipe(id); if(!r) return; S.favRecipes.push(r); toast('Ajouté aux favoris'); }
  save(); render();
}
function cookRecipe(id){
  const r = findRecipe(id); if(!r) return;
  if(!confirm(`Retirer du stock les ingrédients de "${r.title}" ?`)) return;
  for(const ing of r.ingredients){
    if(!ing.stockKey) continue;
    let need = ing.qty;
    const lots = S.items.filter(it => it.productKey === ing.stockKey && it.qty > 0 && !isDead(it)).sort((a,b) => (a.date||'9999').localeCompare(b.date||'9999'));
    for(const lot of lots){ if(need <= 0) break; const take = Math.min(lot.qty, need); lot.qty -= take; need -= take; }
  }
  S.items = S.items.filter(it => it.qty > 0);
  save(); toast('Stock mis à jour'); go('stock');
}

let pFilter = 'all', pOpen = new Set();
function setPF(c){ pFilter = c; render(); }
function togglePG(k){ pOpen.has(k) ? pOpen.delete(k) : pOpen.add(k); render(); }
function spark(vals){
  if(vals.length < 2) return '<svg width="72" height="22"></svg>';
  const mn = Math.min(...vals), mx = Math.max(...vals), w = 72, h = 22, r = mx - mn || 1;
  const pts = vals.map((v,i) => `${(i/(vals.length-1)*(w-4)+2).toFixed(1)},${(h-2-(v-mn)/r*(h-4)).toFixed(1)}`).join(' ');
  return `<svg width="${w}" height="${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="var(--ink)" stroke-width="1.8" stroke-linejoin="round"/></svg>`;
}
function renderPrices(){
  if(!S.purchases.length) return `<h1>Prix</h1><div class="empty"><p>Aucun achat enregistré. Indique le prix payé en ajoutant un produit au stock.</p><button class="btn primary" onclick="go('add')">Ajouter un produit</button></div>`;
  const groups = {};
  for(const p of S.purchases){ const k = (p.generic || p.label || '?').trim().toLowerCase(); (groups[k] ??= {key:k, name:(p.generic || p.label), category:p.category, list:[]}).list.push(p); }
  let gl = Object.values(groups).filter(g => pFilter === 'all' || g.category === pFilter).sort((a,b) => a.name.localeCompare(b.name,'fr'));
  const cats = [...new Set(S.purchases.map(p => p.category))];
  let html = `<h1>Prix</h1><div class="chips"><button class="${pFilter==='all'?'on':''}" onclick="setPF('all')">Tout</button>${Object.keys(CATS).filter(c => cats.includes(c)).map(c => `<button class="${pFilter===c?'on':''}" onclick="setPF('${c}')">${CATS[c].label}</button>`).join('')}</div><ul>`;
  for(const g of gl){
    const list = g.list.slice().sort((a,b) => a.date.localeCompare(b.date));
    const withK = list.filter(p => ppk(p) != null);
    const u = unitOf(g.category);
    const last = list[list.length-1];
    const main = withK.length ? `${eur(ppk(withK[withK.length-1]))}${u}` : eur(last.total / num(last.qty||1));
    const stores = {};
    for(const p of list){ const v = ppk(p); const s = (stores[p.store] ??= {n:0, sum:0, cnt:0, last:p.date, lastPrice:null}); s.n++; s.last = p.date; if(v != null){ s.sum += v; s.cnt++; s.lastPrice = v; } }
    const ranked = Object.entries(stores).filter(([,s]) => s.cnt).map(([k,s]) => [k, s.sum/s.cnt]).sort((a,b) => a[1]-b[1]);
    const sub = [];
    if(ranked.length > 1) sub.push(`Moins cher chez ${esc(ranked[0][0])}, ${eur(ranked[0][1])}${u} en moyenne`);
    else sub.push(`${list.length} achat${list.length>1?'s':''}, dernier chez ${esc(last.store)}`);
    if(withK.length >= 2){ const a = ppk(withK[0]), b = ppk(withK[withK.length-1]), ch = (b-a)/a*100;
      if(Math.abs(ch) >= 1) sub.push(`<span class="${ch>0?'up':'down'}">${ch>0?'+':''}${fmt(ch)} % depuis le ${fdate(withK[0].date)}</span>`); }
    const k1000 = list.map(per1000).filter(v => v != null);
    if(k1000.length) sub.push(`meilleur prix pour 1000 kcal : ${eur(Math.min(...k1000))}`);
    html += `<li class="pg"><button class="pgh" data-k="${esc(g.key)}" onclick="togglePG(this.dataset.k)" aria-expanded="${pOpen.has(g.key)}">
      <span class="pn"><span class="cattag" style="background:${(CATS[g.category]||CATS.autre).color}"></span>${esc(g.name)}</span><span class="pv">${main}</span>
      <span class="ps">${sub.join('. ')}.</span>${spark(withK.map(ppk))}</button>`;
    if(pOpen.has(g.key)){
      html += `<div class="pdet">${ranked.length ? `<table><tr><th>Enseigne</th><th class="r">Moyenne${u}</th><th class="r">Dernier${u}</th><th class="r">Achats</th></tr>${ranked.map(([s,v]) => `<tr><td>${esc(s)}</td><td class="r">${eur(v)}</td><td class="r">${stores[s].lastPrice != null ? eur(stores[s].lastPrice) : '—'}</td><td class="r">${stores[s].n}</td></tr>`).join('')}</table>` : ''}
      <table><tr><th>Date</th><th>Enseigne</th><th class="r">Payé</th><th class="r">${u}</th><th></th></tr>
      ${list.slice().reverse().map(p => `<tr><td>${fdate(p.date)}</td><td>${esc(p.store)}</td><td class="r">${eur(p.total)}</td><td class="r">${ppk(p) != null ? eur(ppk(p)) : ''}</td><td class="r"><button class="del" aria-label="Supprimer cet achat" onclick="delPurchase('${p.id}')">×</button></td></tr>`).join('')}</table></div>`;
    }
    html += `</li>`;
  }
  return html + `</ul>`;
}
function delPurchase(id){ if(!confirm('Supprimer cet achat ?')) return; S.purchases = S.purchases.filter(p => p.id !== id); save(); render(); }

/* ---------- Vue Réglages ---------- */
function renderSettings(){
  const s = S.settings, sum = MACROS.reduce((a,m) => a + num(s.split[m]), 0);
  return `<h1>Réglages</h1>
  <div class="form">
    <h2>Foyer et objectif</h2>
    <div class="g2"><label>Personnes<input data-s="people" inputmode="numeric" value="${s.people}"></label>
    <label>Kcal par personne et par jour<input data-s="kcal" inputmode="numeric" value="${s.kcal}"></label></div>
    <div class="g2"><label>Eau par personne et par jour (L)<input data-s="water" inputmode="decimal" value="${s.water}"></label>
    <label>Objectif d'autonomie (jours)<input data-s="targetDays" inputmode="numeric" value="${s.targetDays}"></label></div>
    <label>Alerte de péremption (semaines avant la date)<input data-s="alertWeeks" inputmode="numeric" value="${s.alertWeeks}"></label>
    <h2>Répartition visée des calories</h2>
    <div class="g3">${MACROS.map(m => `<label>${CATS[m].label} %<input data-split="${m}" inputmode="numeric" value="${s.split[m]}"></label>`).join('')}</div>
    <p class="hint" id="splitsum">${sum === 100 ? 'Total : 100 %' : `<span class="warn">Total : ${sum} %, il faut arriver à 100 %.</span>`}</p>
    <h2>Recettes (IA)</h2>
    <label>Clé API Anthropic<input data-s="apiKey" type="password" autocomplete="off" value="${esc(s.apiKey)}" placeholder="sk-ant-..."></label>
    <p class="hint">Utilisée uniquement pour générer des recettes. La clé reste sur ce téléphone, elle n'est jamais dans le code de l'app.</p>
    <label>Modèle<select data-s="model">${MODELS.map(([v,l]) => `<option value="${v}" ${v===s.model?'selected':''}>${l}</option>`).join('')}</select></label>
    <h2>Sauvegarde</h2>
    <p class="hint">Tes données sont stockées sur ce téléphone uniquement. Exporte-les régulièrement.</p>
    <div class="actions"><button class="btn" onclick="exportData()">Exporter</button>
    <label class="btn">Importer<input type="file" accept="application/json,.json" hidden onchange="importData(this.files[0])"></label></div>
    <p class="hint">${Object.keys(S.products).length} produits connus, ${S.items.length} lots, ${S.purchases.length} achats.</p>
  </div>`;
}
async function exportData(){
  const name = `reserve-${todayLocal()}.json`, blob = new Blob([JSON.stringify({...S, settings:{...S.settings, apiKey:''}}, null, 1)], {type:'application/json'});
  const file = new File([blob], name, {type:'application/json'});
  if(navigator.canShare && navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file], title:name}); return; }catch(e){ if(e.name === 'AbortError') return; } }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function importData(file){
  if(!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const d = merge(JSON.parse(rd.result));
      if(!confirm(`Remplacer les données actuelles par ce fichier (${d.items.length} lots, ${d.purchases.length} achats) ?`)) return;
      d.settings.apiKey = S.settings.apiKey; S = d; save(); toast('Données importées'); render();
    }catch(e){ toast("Fichier illisible : choisis un export de l'app."); }
  };
  rd.readAsText(file);
}

/* ---------- Saisie ---------- */
function onField(e){
  const el = e.target, v = el.type === 'checkbox' ? el.checked : el.value;
  if(el.dataset.f && draft){
    const f = el.dataset.f; draft[f] = v;
    if(f === 'category') draft.catTouched = true;
    if(['p100','f100','c100'].includes(f) && !draft.catTouched){
      draft.category = guessCat(num(draft.p100), num(draft.f100), num(draft.c100));
      const sel = document.querySelector('[data-f=category]'); if(sel) sel.value = draft.category;
    }
  } else if(el.dataset.s){
    const f = el.dataset.s; S.settings[f] = ['apiKey','model'].includes(f) ? String(v).trim() : num(v); save();
  } else if(el.dataset.split){
    S.settings.split[el.dataset.split] = num(v); save();
    const sum = MACROS.reduce((a,m) => a + num(S.settings.split[m]), 0);
    $('#splitsum').innerHTML = sum === 100 ? 'Total : 100 %' : `<span class="warn">Total : ${sum} %, il faut arriver à 100 %.</span>`;
  }
}
document.addEventListener('input', onField);
document.addEventListener('change', e => { if(e.target.matches('select, input[type=checkbox]')) onField(e); });

if('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
render();
</script>
</body>
</html>
